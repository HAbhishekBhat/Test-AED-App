# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
# Avoid Windows file-locking failures while Gradle promotes dependency-accessor workspaces.
org.gradle.projectcachedir=../.gradle-project-cache
android.useAndroidX=true
android.enableJetifier=true
# React Native Old Architecture (Legacy Native Module compatibility)
newArchEnabled=false

# Hermes JavaScript engine enabled
hermesEnabled=true
